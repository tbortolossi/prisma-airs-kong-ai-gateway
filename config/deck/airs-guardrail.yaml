# =============================================================================
# Prisma AIRS AI Runtime (API Intercept) on Kong AI Gateway
#
# Shape : classic Gateway control plane in Konnect, self-managed data planes
# Tool  : deck gateway sync config/deck/airs-guardrail.yaml
# Needs : Kong Gateway 3.14+ with an AI licence (ai-custom-guardrail)
#
# Functional equivalent of config/kongctl/airs-guardrail.yaml. The config block
# is identical; only the wrapper differs. Any change to the guardrail logic must
# be applied to both files in the same commit.
#
# VERIFICATION STATUS: see the header of config/kongctl/airs-guardrail.yaml.
# =============================================================================

_format_version: "3.0"

services:
  - name: llm-openai
    url: https://api.openai.com
    routes:
      - name: llm-chat-completions
        paths:
          - /v1/chat/completions
        strip_path: false

    plugins:
      # -----------------------------------------------------------------------
      # 1. LLM normalisation.
      #    ai-custom-guardrail REQUIRES ai-proxy or ai-proxy-advanced upstream
      #    in the chain. It does not work standalone.
      # -----------------------------------------------------------------------
      - name: ai-proxy-advanced
        config:
          targets:
            - route_type: llm/v1/chat
              auth:
                header_name: Authorization
                header_value: "{vault://env/openai-key}"
              model:
                provider: openai
                name: gpt-4o

      # -----------------------------------------------------------------------
      # 2. Prompt scan: client -> LLM
      # -----------------------------------------------------------------------
      - name: ai-custom-guardrail
        instance_name: airs-prompt-scan
        config:
          # INPUT inspects the request. The enum is BOTH | INPUT | OUTPUT.
          # BOTH is not used here: Prisma AIRS keys prompts and responses
          # differently (contents[].prompt vs contents[].response), so each
          # direction needs its own request body.
          guarding_mode: INPUT
          text_source: concatenate_all_content

          # Schema defaults are timeout 10000 and stop_on_error true. Both are
          # restated because they are load-bearing: stop_on_error is what
          # actually blocks traffic when the AIRS call itself fails, and 10 s of
          # added latency on an unreachable endpoint is too long for an inline
          # guardrail.
          timeout: 5000
          ssl_verify: true
          stop_on_error: true

          params:
            api_key: "{vault://env/airs-token}"
            profile: "kong-airs-prod"
            app_name: "kong-ai-gateway"

          request:
            url: https://service.api.aisecurity.paloaltonetworks.com/v1/scan/sync/request
            headers:
              x-pan-token: "$(conf.params.api_key)"
              Content-Type: "application/json"
              Accept: "application/json"
            # request.body is a flat map of strings. Nested JSON is produced by
            # functions that return a Lua table, as in Kong's Azure Content
            # Safety example. A nested YAML map here fails schema validation.
            body:
              ai_profile: "$(airs_profile)"
              metadata: "$(airs_metadata)"
              contents: "$(airs_contents(content))"

          response:
            block: "$(airs_verdict.block)"
            block_message: "$(airs_verdict.block_message)"

          functions:
            airs_profile: |
              return function(conf)
                return { profile_name = conf.params.profile }
              end

            airs_metadata: |
              return function(conf)
                return { app_name = conf.params.app_name }
              end

            airs_contents: |
              return function(content)
                return { { prompt = content or "" } }
              end

            airs_verdict: |
              return function(resp)
                -- Fail closed: without a verdict, no decision can be trusted.
                if type(resp) ~= "table" or type(resp.action) ~= "string" then
                  return { block = true,
                           block_message = "Request blocked: Prisma AIRS verdict unavailable (fail-closed)" }
                end

                -- AIRS reports its own degradation through category, not action.
                if resp.category == "error" or resp.category == "timeout" then
                  return { block = true,
                           block_message = "Request blocked: Prisma AIRS scan " .. resp.category .. " (fail-closed)" }
                end

                if resp.action ~= "block" then
                  return { block = false, block_message = "Prisma AIRS scan passed" }
                end

                local hits = {}
                for k, v in pairs(resp.prompt_detected or {}) do
                  if v == true then hits[#hits + 1] = k end
                end

                local msg = "Request blocked by Prisma AIRS (" .. tostring(resp.category or "unknown") .. ")"
                if #hits > 0 then msg = msg .. ": " .. table.concat(hits, ", ") end
                if resp.scan_id then msg = msg .. " [scan_id=" .. tostring(resp.scan_id) .. "]" end

                return { block = true, block_message = msg }
              end

      # -----------------------------------------------------------------------
      # 3. Response scan: LLM -> client
      #    Buffers the response before evaluating it. Remove this instance from
      #    routes that serve SSE streaming.
      # -----------------------------------------------------------------------
      - name: ai-custom-guardrail
        instance_name: airs-response-scan
        config:
          guarding_mode: OUTPUT
          text_source: concatenate_all_content

          timeout: 5000
          ssl_verify: true
          stop_on_error: true

          params:
            api_key: "{vault://env/airs-token}"
            profile: "kong-airs-prod"
            app_name: "kong-ai-gateway"

          request:
            url: https://service.api.aisecurity.paloaltonetworks.com/v1/scan/sync/request
            headers:
              x-pan-token: "$(conf.params.api_key)"
              Content-Type: "application/json"
              Accept: "application/json"
            body:
              ai_profile: "$(airs_profile)"
              metadata: "$(airs_metadata)"
              contents: "$(airs_contents(content))"

          response:
            block: "$(airs_verdict.block)"
            block_message: "$(airs_verdict.block_message)"

          functions:
            airs_profile: |
              return function(conf)
                return { profile_name = conf.params.profile }
              end

            airs_metadata: |
              return function(conf)
                return { app_name = conf.params.app_name }
              end

            # AIRS accepts a response-only content object. The originating
            # prompt is not reachable from the OUTPUT phase, where $(content) is
            # the model output, so this scan carries no prompt context.
            airs_contents: |
              return function(content)
                return { { response = content or "" } }
              end

            airs_verdict: |
              return function(resp)
                -- Kong documents $(resp) as a string in the OUTPUT phase.
                -- Decode defensively; an undecodable verdict blocks.
                if type(resp) == "string" then
                  local ok, decoded = pcall(function()
                    return require("cjson.safe").decode(resp)
                  end)
                  resp = ok and decoded or nil
                end

                if type(resp) ~= "table" or type(resp.action) ~= "string" then
                  return { block = true,
                           block_message = "Response blocked: Prisma AIRS verdict unavailable (fail-closed)" }
                end

                if resp.category == "error" or resp.category == "timeout" then
                  return { block = true,
                           block_message = "Response blocked: Prisma AIRS scan " .. resp.category .. " (fail-closed)" }
                end

                if resp.action ~= "block" then
                  return { block = false, block_message = "Prisma AIRS scan passed" }
                end

                local hits = {}
                for k, v in pairs(resp.response_detected or {}) do
                  if v == true then hits[#hits + 1] = k end
                end

                local msg = "Response blocked by Prisma AIRS (" .. tostring(resp.category or "unknown") .. ")"
                if #hits > 0 then msg = msg .. ": " .. table.concat(hits, ", ") end
                if resp.scan_id then msg = msg .. " [scan_id=" .. tostring(resp.scan_id) .. "]" end

                return { block = true, block_message = msg }
              end
