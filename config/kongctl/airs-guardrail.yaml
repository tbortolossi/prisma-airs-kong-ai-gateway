# =============================================================================
# Prisma AIRS AI Runtime (API Intercept) on Kong AI Gateway 2.x
#
# Shape : AI Gateway 2.x control plane in Konnect, self-managed data planes
# Tool  : kongctl apply -f config/kongctl/airs-guardrail.yaml
# Needs : data planes on Kong Gateway 3.14+ with an AI licence
#
# Declares two AI Policies of type ai-custom-guardrail. No custom plugin,
# no data plane image rebuild. The two policies differ by COVERAGE, not by
# direction, and their config blocks are identical except for guarding_mode:
#
#   airs-scan         guarding_mode: BOTH   prompt in INPUT, model output in OUTPUT
#   airs-prompt-scan  guarding_mode: INPUT  prompt only, for streaming models
#
# Attach exactly ONE of them per AI Model. Kong runs a single instance of a
# given plugin per request, so stacking both on the same model does not give
# prompt-plus-response coverage; airs-scan already does.
#
# VERIFICATION STATUS (full table in README.md, "Verification status")
#   DOCUMENTED  : every config key used below, and its allowed values, come from
#                 the plugin schema at
#                 https://developer.konghq.com/plugins/ai-custom-guardrail/reference/
#                 guarding_mode is an enum of BOTH | INPUT | OUTPUT.
#                 params, request.headers and request.body are referenceable,
#                 so {vault://...} resolves inside them.
#                 Dotted access to a function result, "$(fn.field)", is shown
#                 in Kong's Azure Content Safety example
#                 ($(check_response.block), $(check_response.block_message)).
#                 $(source) is documented by the plugin overview as "INPUT" while
#                 inspecting the request and "OUTPUT" while inspecting the
#                 response; $(resp) as a Lua table in INPUT and a string in
#                 OUTPUT.
#                 The Prisma AIRS request and response shapes come from the
#                 generated OpenAPI client in PaloAltoNetworks/aisecurity-python-sdk.
#   LAB-VERIFIED : functions are referenced BARE, "$(fn)", and the built-ins are
#                 injected BY PARAMETER NAME, not by position: a function
#                 declaring (source, content) receives them, one declaring
#                 (conf) receives the config, one declaring (resp, source)
#                 receives the guardrail response and the phase. An unknown
#                 parameter name is rejected outright — "argument 'a' is not
#                 allowed in guardrail functions". The explicit-argument call
#                 form "$(fn(source, content))" this repository shipped until
#                 2026-09-08 is NOT valid: the data plane answers 500,
#                 "failed to render by function: invalid expression syntax",
#                 and no request reaches the model. Observed on Kong AI Gateway
#                 2.0.3 / Kong Gateway 3.14.0.3-enterprise.
#   LAB-VERIFIED : $(resp) is a Lua TABLE in both phases, OUTPUT included. The
#                 plugin overview's "string when inspecting the response" does
#                 not hold for the guardrail service response. The cjson.safe
#                 branch in the OUTPUT verdict is therefore dead code.
#   LAB-VERIFIED : a block returns HTTP 400 with the body
#                 {"error":{"message":"<block_message>"}}.
#   LAB-VERIFIED : with text_source concatenate_all_content, $(content) is the
#                 message contents joined by "\n\n", system prompt included,
#                 and the model output alone in the OUTPUT phase.
#   LAB-VERIFIED : streamed responses ARE scanned (2026-09-14, correcting the
#                 2026-09-08 note that said the OUTPUT phase was never
#                 invoked). With stream: true the OUTPUT phase runs once per
#                 segment of about response_buffer_size bytes, each segment as
#                 its own contents[].response call, and whatever is still below
#                 the threshold when the stream ends is never scanned. That is
#                 why the 2026-09-08 run, with response_buffer_size 65536, saw
#                 no OUTPUT call at all. A block verdict on a segment cuts the
#                 stream, but that segment has already been delivered and HTTP
#                 200 already sent. Non-streamed responses are scanned in one
#                 call carrying the whole body, whatever the buffer size. The
#                 posture for airs-scan is therefore to refuse streaming at the
#                 model (response_streaming: deny, attachment extract below).
#   LAB-VERIFIED : a function that raises refuses the request with HTTP 500
#                 before the model is called, independent of stop_on_error.
#                 The Lua error text reaches the client verbatim, so error()
#                 messages must never carry anything sensitive.
#   LAB-VERIFIED : metrics.* templates are evaluated, and block_detail must
#                 evaluate to a TABLE. With a string the data plane logged
#                 "metric input_block_detail has unexpected type string,
#                 expected table" at every request and dropped the metric
#                 (2026-09-14); airs_verdict.detail is a table for that reason.
#                 Export to Konnect AI analytics is not verified.
#   LAB-VERIFIED : response_buffer_size is left at its schema default (100).
#                 The 65536 this repository shipped until 2026-09-14 turned a
#                 streamed response into silence (see the streaming entry).
#   LAB-VERIFIED : correlation identifiers, 2026-09-14. They nest:
#                 transaction_id (and tr_id, its older name) is one ROUND, a
#                 prompt and the response it produced; session_id is the
#                 CONVERSATION grouping several rounds. The round carries the
#                 SAME value in the INPUT and the OUTPUT scan of one
#                 non-streamed exchange, because airs_correlation stashes it
#                 in kong.ctx.shared, which survives between the two phases.
#                 Measured on the echo server: two rounds under one
#                 x-airs-session-id came out as two distinct round identifiers
#                 sharing one session identifier, and a caller naming its own
#                 round with x-airs-transaction-id overrode the Kong request id
#                 in both phases. Accepted by the live Prisma AIRS tenant
#                 (test-airs.sh 5/5), and confirmed in the Strata Cloud
#                 Manager AI Sessions view: two rounds sent through Kong under
#                 one session header render as ONE session containing TWO
#                 transactions of two scans each, the transaction ids being the
#                 Kong request ids.
#   LAB-VERIFIED : tr_id is the older name of session_id, NOT of
#                 transaction_id, so it is not sent. Six probes straight
#                 against a live tenant's /v1/scan/sync/request: tr_id alone
#                 comes back with session_id set to that value and a generated
#                 transaction_id; transaction_id alone comes back with a
#                 generated session_id; with tr_id and session_id both
#                 supplied, session_id wins. Sending the round under tr_id
#                 would put the round identifier in the session slot.
#   LAB-VERIFIED : the Kong PDK is reachable inside a guardrail function body
#                 (kong and ngx are tables, require works), which is how
#                 airs_correlation gets a per-request value. This contradicts
#                 an earlier reading of this repository's own notes: the
#                 plugin's refusal of unknown ARGUMENT names says nothing
#                 about the sandbox's globals.
#   LAB-VERIFIED : every PDK call must be wrapped in pcall. On a STREAMED
#                 response the OUTPUT phase runs with no request context, and
#                 an unguarded raise there does not fail the request — it
#                 silently skips the guardrail call for that segment. Measured
#                 on one streamed request, same policy: a function returning a
#                 constant gave 7 OUTPUT segment scans, the same function
#                 calling kong.request.get_header unguarded gave ZERO with
#                 HTTP 200 and the stream delivered whole, and the pcall
#                 version gave 7 again. An unguarded PDK call is therefore a
#                 fail-OPEN on streams.
#   LAB-VERIFIED : a function field that is nil is omitted from the scan
#                 payload; a field that is an EMPTY STRING is rendered as JSON
#                 false. airs_correlation returns nil, never "", for an
#                 identifier it cannot build.
#   LAB-VERIFIED : Prisma AIRS judges only the LAST element of contents[],
#                 2026-09-14. The earlier elements are context and are not
#                 scanned: an injection sent first of two, or first of three,
#                 comes back allow/benign; the same injection last, or alone,
#                 blocks; and inside one element together with benign text --
#                 the shape that has always shipped -- it blocks. airs_contents
#                 therefore returns ONE element. An intermediate version
#                 written the same day split the conversation into one element
#                 per message, which matches a natural reading of the schema
#                 and would have stopped scanning every turn but the newest.
#   LAB-VERIFIED : the scanned text is role-attributed, 2026-09-14, and this
#                 is a FALSE POSITIVE FIX, not a cosmetic one. text_source
#                 joins message content with no indication of who said what.
#                 An ordinary two-turn chat -- "And Italy? / The capital of
#                 France is Paris. / What is the capital of France?" -- was
#                 blocked as agent + injection, three times out of three on a
#                 live tenant: the assistant's own answer, unattributed, reads
#                 as an assertion planted in the prompt. The report's pi
#                 snippet showed exactly that text. The same turns prefixed
#                 "user:" and "assistant:" come back benign, in either order,
#                 and a real injection still blocks whether it is the newest
#                 turn or an earlier one. Replayed through the gateway after
#                 the change: the blocked conversation passes 3/3, the same
#                 conversation ending in an injection blocks 3/3, and
#                 test-airs.sh stays 5/5.
#                 The system message is deliberately NOT labelled: writing
#                 "system:" into the scanned text is the shape of a
#                 system-prompt spoof and gets the whole conversation blocked
#                 as agent + injection, while the same content unlabelled is
#                 benign. Tool results and unknown roles go in unlabelled for
#                 the same reason.
#   LAB-VERIFIED : tool scanning, 2026-09-14. Tool definitions and the
#                 arguments a model generates are absent from $(content) under
#                 every text_source, so a tool call is scanned only on its way
#                 back in, as the text of its result. With params.tool_scan set
#                 to "calls" the scanned text is rebuilt from the request body
#                 with those arguments appended. Measured with guarding_mode
#                 INPUT so only the prompt leg could act: a conversation whose
#                 injection sat solely inside a tool call's arguments was
#                 allowed 5/5 with the setting off and blocked 5/5 with it on,
#                 and test-airs.sh passes 5/5 either way.
#                 contents[].tool_event is the richer alternative and a live
#                 tenant does flag it (injection on input_detected, threats
#                 "context poisoning"), with ecosystem forced to "mcp" and
#                 method to tools/call or tools/list -- anything else is HTTP
#                 400. It is not used here because it is judged only as the
#                 last element, so it would displace the prompt from the scan.
#   LAB-VERIFIED : enriched metadata, 2026-09-14. metadata.ai_model,
#                 metadata.user_ip and metadata.app_user are reachable from a
#                 guardrail function and are populated on a normal request.
#                 user_ip is what Kong considers the client address: it is the
#                 X-Forwarded-For value only when the peer is in the data
#                 plane's trusted_ips, and the direct peer address otherwise --
#                 behind a load balancer, set trusted_ips or the record shows
#                 the balancer.
#   LAB-VERIFIED : both degrade, they never break. On a STREAMED response the
#                 OUTPUT segments have no request context: the payload is the
#                 text Kong selected and metadata is app_name alone, and the
#                 segments are STILL SCANNED -- seven segment calls on a
#                 700-character stream, the same count as before this change.
#                 That is what the pcall around every PDK call buys; without it
#                 the scan is skipped silently.
#   LAB-VERIFIED : array-shaped message content, 2026-09-15. A chat message
#                 whose content is an array of parts -- what Open WebUI and
#                 most OpenAI-compatible SDKs send once a file or image is
#                 attached -- was silently dropped from the scanned text
#                 whenever another turn in the same conversation was a plain
#                 string, so an injection hidden in an array part reached
#                 the model unscanned. airs_contents now assembles the text
#                 parts and labels them like a string turn, skips image_url
#                 / input_audio / file parts, and falls back to the flat
#                 text_source text on any part shape it does not recognise.
#                 Measured through the Open WebUI shim path
#                 (X-OpenWebUI-Chat-Id / X-OpenWebUI-User-Email): a benign
#                 array-content turn allowed; a string user turn, a string
#                 assistant turn and an array-content user turn carrying the
#                 injection in its text part blocked (HTTP 400); an
#                 image-only turn followed by a text-part turn allowed; a
#                 turn mixing a text part and an image_url part allowed;
#                 test-airs.sh 5/5. The attributed payload itself was not
#                 captured on an echo server this run -- 14 offline
#                 assertions still pin its shape.
#   NOT PRESENT : retry and cache options. The plugin schema has neither.
#
# Replace params.profile with your Prisma AIRS security profile name, and
# params.app_name with a label identifying this gateway in your scan logs.
# If your AIRS tenant is not on the global endpoint, change request.url.
# =============================================================================

ai_gateway_policies:

  # ---------------------------------------------------------------------------
  # airs-scan: prompt and response
  # Scans the prompt before it reaches the model and the model output before
  # it reaches the client. On a non-streamed response the output is one scan
  # of the whole body. On a streamed response it is one scan per segment of
  # about response_buffer_size bytes, the flagged segment already delivered
  # by the time it is blocked (LAB-VERIFIED 2026-09-14). Simple mode leaves
  # streaming allowed and accepts that; strict mode pairs this policy with
  # response_streaming: deny on the model (attachment extract below) and
  # gives models that must stream airs-prompt-scan instead.
  # ---------------------------------------------------------------------------
  - ref: airs-scan
    ai_gateway: !lookup { id: !env AI_GATEWAY_ID }
    name: airs-scan
    display_name: "Prisma AIRS - prompt and response scan"
    type: ai-custom-guardrail
    enabled: true
    config:
      # The enum is BOTH | INPUT | OUTPUT. Prisma AIRS keys prompts and
      # responses differently (contents[].prompt vs contents[].response);
      # airs_contents below picks the key from $(source).
      guarding_mode: BOTH
      text_source: concatenate_all_content

      # Schema defaults are timeout 10000 and stop_on_error true. Both are
      # restated because they are load-bearing: stop_on_error is what actually
      # blocks traffic when the AIRS call itself fails, and 10 s of added
      # latency on an unreachable endpoint is too long for an inline guardrail.
      # LAB-VERIFIED 2026-09-14: stop_on_error false alone passes the traffic
      # unscanned when the call fails (HTTP 200, verdict never evaluated); true
      # answers HTTP 500 with the failure text. The timeout is honoured to the
      # millisecond (5.0 s measured at 5000).
      timeout: 5000
      ssl_verify: true
      stop_on_error: true

      # Present on Kong AI Gateway 2.0.1+ data planes (changelog,
      # https://developer.konghq.com/ai-gateway/changelog/), LAB-VERIFIED
      # 2026-09-14 on 2.0.3 / Kong Gateway 3.14.0.3, but ABSENT from the
      # published schema page: uncommenting one makes
      # scripts/check-plugin-schema.py --schema fail until Kong publishes it.
      #   rejection_mode         none (default) is today's contract, HTTP 400
      #                          with the message. verbose: HTTP 403, structured
      #                          body, code GUARDRAIL_BLOCKED, the message as
      #                          "reason", no detail leaked. stealth: HTTP 403
      #                          "request forbidden", message and scan_id lost.
      #   continue_on_detection  true is monitor mode for pilots: a block
      #                          verdict passes with HTTP 200, the guardrail is
      #                          still called. Does not cover a failed call.
      #   log_blocked_content    keep false, prompts are PII.
      #   proxy_config           forward proxy for the guardrail call: http_proxy_host /
      #                          _port, https_proxy_host / _port, auth_username /
      #                          auth_password (referenceable), no_proxy. LAB-VERIFIED
      #                          2026-09-14 for both pairs: http (both phases relayed by a
      #                          logging proxy) and https (real Prisma AIRS endpoint
      #                          through a CONNECT proxy, test-airs.sh 5/5).
      # rejection_mode: verbose
      # continue_on_detection: true
      # log_blocked_content: false
      # proxy_config:
      #   https_proxy_host: proxy.example.internal
      #   https_proxy_port: 3128

      # response_buffer_size is deliberately NOT set; the schema default (100)
      # applies. LAB-VERIFIED 2026-09-14: it only matters for streams. A
      # non-streamed response is always scanned in one call carrying the whole
      # body. A streamed response is scanned in segments of about that many
      # bytes, and whatever remains below the threshold when the stream ends
      # is never scanned: at 65536, the value shipped until 2026-09-14, a
      # typical completion produced no OUTPUT call at all, which is what the
      # 2026-09-08 run measured. A block on a segment cuts the stream after
      # that segment has already reached the client.

      params:
        profile: "kong-airs-prod"
        app_name: "kong-ai-gateway"
        # Request headers the caller may use to name its own correlation
        # identifiers. session_header names the CONVERSATION, which only the
        # caller can know: absent, the conversation is the single exchange.
        # transaction_header names the ROUND, and is optional too - absent,
        # the round is Kong's own request id, which is already correct. Point
        # both at whatever headers your application already sends.
        transaction_header: "x-airs-transaction-id"
        session_header: "x-airs-session-id"
        # Metadata enrichment. user_header names a request header carrying the
        # end user, used only when no Kong consumer is authenticated; it is
        # caller-controlled, so it labels a scan and never authenticates one.
        # context_messages caps how many conversation messages are sent as scan
        # context; leave it out to send the whole conversation, as the flat
        # payload always did.
        user_header: "x-airs-user"
        # context_messages: "20"
        # tool_scan turns function-call scanning on. Absent or any other value:
        # off, and the scanned text is exactly what text_source produced, which
        # is what shipped before 2026-09-14. "calls" rebuilds that text from the
        # request body and appends the arguments the model generated for each
        # tool call -- which no text_source ever exposed, so a tool call was
        # scanned only on its way back in. "catalogue" prepends the tools[]
        # declaration too: that is the tool-poisoning surface, and also the one
        # a profile with the source_code detector flags, because a JSON
        # parameter schema reads as code (LAB-VERIFIED 2026-09-14). Try it
        # against your profile before enabling it.
        # tool_scan: "calls"

      request:
        url: https://service.api.aisecurity.paloaltonetworks.com/v1/scan/sync/request
        # request.auth is the schema's dedicated slot for the credential:
        # value is referenceable, so the vault reference resolves here, and
        # it is stored encrypted, which config.params is not. LAB-VERIFIED
        # 2026-09-08 against a live Prisma AIRS tenant, replacing the earlier
        # params.api_key + $(conf.params.api_key) interpolation.
        auth:
          location: header
          name: x-pan-token
          value: "{vault://env/airs-token}"
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        # request.body is a flat map of strings. Nested JSON is produced by
        # functions that return a Lua table, as in Kong's Azure Content Safety
        # example. A nested YAML map here fails schema validation.
        body:
          # Correlation identifiers, built by airs_correlation below. They nest:
          # transaction_id is one ROUND, a prompt and the response it produced,
          # and carries the same value in the INPUT and the OUTPUT scan so Strata
          # Cloud Manager shows the two verdicts as one exchange; session_id is
          # the CONVERSATION grouping several rounds, taken from the caller's
          # header and falling back to the round so an exchange is never split
          # across two sessions. tr_id is deliberately absent: on a live tenant
          # it is the older name of session_id, not of transaction_id. A field
          # the function leaves nil is omitted from the payload; an empty string
          # would be sent as JSON false.
          transaction_id: "$(airs_correlation.transaction_id)"
          session_id: "$(airs_correlation.session_id)"
          ai_profile: "$(airs_profile)"
          metadata: "$(airs_metadata)"
          contents: "$(airs_contents)"

      response:
        block: "$(airs_verdict.block)"
        block_message: "$(airs_verdict.block_message)"

      # metrics.* templates are evaluated (LAB-VERIFIED 2026-09-14). This is
      # the channel that keeps the category and the detection names out of
      # the client response and in the gateway's own telemetry.
      metrics:
        # block_reason is a string: the generic message with scan_id, for
        # correlation with the Prisma AIRS scan log. block_detail must be a
        # TABLE: as a string the data plane logs "metric input_block_detail
        # has unexpected type string, expected table" at every request and
        # drops it (LAB-VERIFIED 2026-09-14). airs_verdict.detail is
        # { reason, category, detections }.
        block_reason: "$(airs_verdict.block_message)"
        block_detail: "$(airs_verdict.detail)"

      functions:
        airs_correlation: |
          return function(conf)
            -- Correlation identifiers for the Prisma AIRS scan log. They nest, and the
            -- two are not interchangeable: transaction_id is ONE ROUND, a prompt and the
            -- response it produced, while session_id is the CONVERSATION that groups
            -- several rounds.
            -- A round is Kong's own request id, so the INPUT and the OUTPUT scan of one
            -- exchange share it. A conversation can only come from the caller; when no
            -- session header is sent, session_id falls back to the round, so the two
            -- scans of one exchange still land in one session instead of two.
            -- tr_id is deliberately NOT sent. On a live tenant it is the older name of
            -- session_id, not of transaction_id: sending tr_id alone sets session_id to
            -- that value, and when both are sent session_id wins (LAB-VERIFIED
            -- 2026-09-14, six probes straight against /v1/scan/sync/request).
            -- Every PDK call below is wrapped in pcall on purpose. On a STREAMED
            -- response the OUTPUT phase runs with no request context, and an unguarded
            -- raise there does not fail the request: it silently skips the scan
            -- (LAB-VERIFIED 2026-09-14). Returning an empty table is the safe outcome --
            -- a nil field is omitted from the scan payload, while an empty string is
            -- rendered as JSON false, which is not a valid identifier.
            local ok, shared = pcall(function() return kong.ctx.shared end)
            if not ok or type(shared) ~= "table" then return {} end
            if type(shared.airs_correlation) == "table" then return shared.airs_correlation end
            local function header(name)
              if type(name) ~= "string" or name == "" then return nil end
              local got, value = pcall(function() return kong.request.get_header(name) end)
              if got and type(value) == "string" and #value > 0 and #value <= 256 then return value end
              return nil
            end
            local params = conf.params or {}
            local round = header(params.transaction_header)
            if round == nil then
              local got, request_id = pcall(function() return ngx.var.request_id end)
              if got and type(request_id) == "string" and #request_id > 0 then round = request_id end
            end
            if round == nil then return {} end
            local correlation = {
              transaction_id = round,
              session_id = header(params.session_header) or round,
            }
            shared.airs_correlation = correlation
            return correlation
          end

        airs_profile: |
          return function(conf)
            return { profile_name = conf.params.profile }
          end

        airs_metadata: |
          return function(conf)
            local params = (conf and conf.params) or {}
            -- Every lookup is pcall-guarded and may yield nothing: on a streamed OUTPUT
            -- segment there is no request context at all, and an unguarded raise there
            -- silently skips the scan rather than failing the request (LAB-VERIFIED
            -- 2026-09-14). A field that cannot be built is left nil, which the plugin
            -- omits from the payload; an empty string would be sent as JSON false.
            local function first(...)
              for _, get in ipairs({ ... }) do
                local ok, value = pcall(get)
                if ok and type(value) == "string" and #value > 0 and #value <= 256 then
                  return value
                end
              end
              return nil
            end
            return {
              app_name = params.app_name,
              ai_model = first(function() return ngx.ctx.ai_model.name end,
                               function() return kong.request.get_body().model end),
              user_ip = first(function() return kong.client.get_forwarded_ip() end,
                              function() return kong.client.get_ip() end),
              -- The authenticated consumer first: it is the identity Kong established.
              -- The header is the fallback for a gateway fronting an application that
              -- knows its end user, and it is caller-controlled -- fine for a scan-log
              -- label, never to be treated as an authenticated identity.
              app_user = first(function()
                                 local consumer = kong.client.get_consumer()
                                 return consumer and (consumer.username or consumer.id) or nil
                               end,
                               function() return kong.request.get_header(params.user_header) end),
            }
          end

        # Builds contents[] from the phase. The reference is bare: the plugin
        # injects source and content by parameter name. LAB-VERIFIED
        # 2026-09-08. A function that raises fails the request closed with
        # HTTP 500, verified the same day.
        # The type guard is mandatory, and its reason changed with the lab
        # run. Built-ins are injected by parameter name, so a Kong change to
        # that mapping — or a typo in a parameter name — would hand this
        # function something other than the scanned text. A permissive
        # fallback such as `content or ""` would then JSON-encode whatever
        # arrived into contents[].prompt and ship it to Prisma AIRS and its
        # scan logs. The API key is no longer exposed that way since the
        # credential moved to request.auth, but the profile name, the app
        # name and any future param would be. Raising is safe: a function
        # that errors returns HTTP 500 and the request never reaches the
        # model. LAB-VERIFIED 2026-09-08.
        airs_contents: |
          return function(source, content, conf)
            -- The type guard comes first and has no fallback. Built-ins are injected by
            -- parameter name, so a Kong change to that mapping, or a typo in a name,
            -- would hand this function something other than the scanned text; a
            -- permissive fallback would then JSON-encode whatever arrived and ship it to
            -- Prisma AIRS. Raising refuses the request with HTTP 500 before the model is
            -- called (LAB-VERIFIED 2026-09-08).
            if type(content) ~= "string" then
              error("airs_contents: content is not a string; refusing to build the scan payload")
            end
            -- ONE element, always. Prisma AIRS judges the LAST element of contents[] and
            -- treats the earlier ones as context only: an injection placed in any but
            -- the last element comes back allow/benign (LAB-VERIFIED 2026-09-14). So
            -- everything that must be scanned has to be inside the element sent last.
            if source == "OUTPUT" then return { { response = content } } end
            if source ~= "INPUT" then
              error("airs_contents: unknown phase " .. tostring(source))
            end
            local flat = { { prompt = content } }
            -- Rebuild the scanned text from the request body, with each turn attributed.
            -- text_source joins message CONTENT only, with no indication of who said
            -- what, and that alone produces false positives on ordinary conversation:
            -- "And Italy? / The capital of France is Paris. / What is the capital of
            -- France?" was blocked as agent + injection, three times out of three, on a
            -- live tenant -- the assistant's own answer, unattributed, reads as an
            -- assertion planted in the prompt. The same turns prefixed "user:" and
            -- "assistant:" come back benign, in either order, while a real injection
            -- still blocks whether it is the newest turn or an earlier one
            -- (LAB-VERIFIED 2026-09-14).
            local ok, body = pcall(function() return kong.request.get_body() end)
            if not ok or type(body) ~= "table" or type(body.messages) ~= "table" then
              return flat
            end
            local params = (conf and conf.params) or {}
            local mode = params.tool_scan
            local want_tools = (mode == "calls" or mode == "catalogue")
            local loaded, cjson = pcall(require, "cjson.safe")
            local encode = (loaded and type(cjson) == "table") and cjson.encode or nil
            local parts, count = {}, 0
            local function push(text)
              if type(text) == "string" and text ~= "" then
                count = count + 1
                parts[count] = text
              end
            end
            -- The tool catalogue is the tool-poisoning surface. It is also the most
            -- likely to be flagged as source code, since a JSON parameter schema reads
            -- as code to a profile with that detector on, which is why it is its own
            -- opt-in rather than part of "calls".
            if mode == "catalogue" and encode and type(body.tools) == "table" then
              push(encode(body.tools))
            end
            for _, message in ipairs(body.messages) do
              if type(message) ~= "table" then return flat end
              local role, text = message.role, message.content
              -- Message content is a string on the common path, but an ARRAY of
              -- parts as soon as the client attaches a file -- what Open WebUI and
              -- most SDKs send. Skipping such a turn dropped it from the scanned
              -- text while the other turns kept count > 0, so the flat fallback
              -- never fired and an injection hidden in an array part was never
              -- judged. Assemble the text parts instead, and fall back to the flat
              -- text on any shape not understood rather than narrowing the scan.
              if type(text) == "table" then
                local chunks, seen = {}, 0
                for _, part in ipairs(text) do
                  if type(part) ~= "table" then return flat end
                  seen = seen + 1
                  local kind = part.type
                  if kind == "text" then
                    if type(part.text) ~= "string" then return flat end
                    chunks[#chunks + 1] = part.text
                  elseif kind ~= "image_url" and kind ~= "input_audio" and kind ~= "file" then
                    return flat
                  end
                end
                -- image_url, input_audio and file parts carry no text to scan, so they
                -- are skipped and a turn made only of those contributes nothing, exactly
                -- like an empty content string -- an image with no caption is ordinary
                -- multimodal use, not a shape to bail out on. Any OTHER part type,
                -- unknown or missing altogether, falls back to the flat text instead, so
                -- an unrecognised shape can never silently narrow the scan. Walking zero
                -- parts is that same unknown shape -- an empty array, or a map-shaped
                -- content table ipairs does not enumerate -- and is only expected on a
                -- tool call.
                if seen == 0 and type(message.tool_calls) ~= "table" then return flat end
                text = table.concat(chunks, "\n")
              end
              if type(text) == "string" and text ~= "" then
                -- Only user and assistant turns are labelled. A "system:" prefix is
                -- exactly the shape of a system-prompt spoof, and writing it ourselves
                -- gets the whole conversation blocked as agent + injection (LAB-VERIFIED
                -- 2026-09-14) -- so the system prompt, tool results and any unknown role
                -- go in unlabelled, which is what they were before this change.
                if role == "user" or role == "assistant" then
                  push(role .. ": " .. text)
                else
                  push(text)
                end
              end
              if want_tools and type(message.tool_calls) == "table" then
                for _, call in ipairs(message.tool_calls) do
                  local fn = (type(call) == "table" and type(call["function"]) == "table")
                    and call["function"] or nil
                  if fn then
                    local arguments = fn.arguments
                    if type(arguments) ~= "string" and encode then
                      arguments = encode(arguments)
                    end
                    if type(arguments) == "string" then
                      push((type(fn.name) == "string" and fn.name or "tool") .. " " .. arguments)
                    end
                  end
                end
              end
            end
            if count == 0 then return flat end
            local cap = tonumber(params.context_messages or "")
            if cap and cap >= 1 and count > cap then
              local trimmed = {}
              for i = count - cap + 1, count do trimmed[#trimmed + 1] = parts[i] end
              parts = trimmed
            end
            return { { prompt = table.concat(parts, "\n\n") } }
          end

        # Maps the AIRS ScanResponse to Kong's block decision. The client only
        # ever sees "Blocked by Prisma AIRS" plus the scan_id; the category and
        # the detection names go to `detail`, a table { reason, category,
        # detections } wired to metrics.block_detail above (a table because
        # the data plane drops a string there, LAB-VERIFIED 2026-09-14).
        # Naming the detection to the caller is an evasion oracle, and Palo
        # Alto's own reference integration returns a generic body.
        airs_verdict: |
          return function(resp)
            -- $(resp) is a table in BOTH phases on Kong AI Gateway 2.0.3, so this
            -- branch is inactive today. Kept: require and cjson.safe.decode work in a
            -- guardrail function, so it is real cover if a release ever passes a
            -- string — without it such a release would fail every request closed.
            if type(resp) == "string" then
              local ok, decoded = pcall(function()
                return require("cjson.safe").decode(resp)
              end)
              resp = ok and decoded or nil
            end
            -- Fail closed: without a verdict, no decision can be trusted. detail is
            -- always a table: metrics.block_detail drops a string (LAB-VERIFIED).
            if type(resp) ~= "table" or type(resp.action) ~= "string" then
              return { block = true, block_message = "Blocked by Prisma AIRS", detail = {
                reason = "verdict unavailable (fail-closed)", category = "unavailable", detections = {} } }
            end
            local msg = "Blocked by Prisma AIRS"
            if resp.scan_id then msg = msg .. " [scan_id=" .. tostring(resp.scan_id) .. "]" end
            -- AIRS reports its own degradation through category, with action=allow.
            if resp.category == "error" or resp.category == "timeout" then
              return { block = true, block_message = msg, detail = {
                reason = "scan " .. resp.category .. " (fail-closed)", category = resp.category, detections = {} } }
            end
            if resp.action == "allow" then
              return { block = false, block_message = "", detail = { reason = "", category = "", detections = {} } }
            end
            -- Category and detection names go to detail, never to the client.
            local hits = {}
            for _, key in ipairs({ "prompt_detected", "response_detected" }) do
              if type(resp[key]) == "table" then
                for name, fired in pairs(resp[key]) do
                  if fired == true then hits[#hits + 1] = tostring(name) end
                end
              end
            end
            table.sort(hits)
            local category = tostring(resp.category or "unknown")
            local reason = resp.action == "block" and category or ("unexpected action " .. resp.action)
            if #hits > 0 then reason = reason .. ": " .. table.concat(hits, ", ") end
            return { block = true, block_message = msg, detail = { reason = reason, category = category, detections = hits } }
          end

  # ---------------------------------------------------------------------------
  # airs-prompt-scan: prompt only
  # Same config as airs-scan with guarding_mode INPUT, for models that must
  # stream. On a stream airs-scan would scan the output per segment, with the
  # flagged segment already delivered and one AIRS round trip per segment
  # (LAB-VERIFIED 2026-09-14); this variant makes the trade-off explicit
  # instead: the prompt is scanned, the model output is not.
  # ---------------------------------------------------------------------------
  - ref: airs-prompt-scan
    ai_gateway: !lookup { id: !env AI_GATEWAY_ID }
    name: airs-prompt-scan
    display_name: "Prisma AIRS - prompt scan"
    type: ai-custom-guardrail
    enabled: true
    config:
      guarding_mode: INPUT
      text_source: concatenate_all_content

      timeout: 5000
      ssl_verify: true
      stop_on_error: true

      # Same 2.0.1+ fields as in airs-scan, absent from the published schema;
      # read the note there before uncommenting any of them.
      # rejection_mode: verbose
      # continue_on_detection: true
      # log_blocked_content: false

      # response_buffer_size is not set here either (schema default, and
      # unused with guarding_mode INPUT: response guard only).

      params:
        profile: "kong-airs-prod"
        app_name: "kong-ai-gateway"
        # Request headers the caller may use to name its own correlation
        # identifiers. session_header names the CONVERSATION, which only the
        # caller can know: absent, the conversation is the single exchange.
        # transaction_header names the ROUND, and is optional too - absent,
        # the round is Kong's own request id, which is already correct. Point
        # both at whatever headers your application already sends.
        transaction_header: "x-airs-transaction-id"
        session_header: "x-airs-session-id"
        # Metadata enrichment. user_header names a request header carrying the
        # end user, used only when no Kong consumer is authenticated; it is
        # caller-controlled, so it labels a scan and never authenticates one.
        # context_messages caps how many conversation messages are sent as scan
        # context; leave it out to send the whole conversation, as the flat
        # payload always did.
        user_header: "x-airs-user"
        # context_messages: "20"
        # tool_scan turns function-call scanning on. Absent or any other value:
        # off, and the scanned text is exactly what text_source produced, which
        # is what shipped before 2026-09-14. "calls" rebuilds that text from the
        # request body and appends the arguments the model generated for each
        # tool call -- which no text_source ever exposed, so a tool call was
        # scanned only on its way back in. "catalogue" prepends the tools[]
        # declaration too: that is the tool-poisoning surface, and also the one
        # a profile with the source_code detector flags, because a JSON
        # parameter schema reads as code (LAB-VERIFIED 2026-09-14). Try it
        # against your profile before enabling it.
        # tool_scan: "calls"

      request:
        url: https://service.api.aisecurity.paloaltonetworks.com/v1/scan/sync/request
        # request.auth is the schema's dedicated slot for the credential:
        # value is referenceable, so the vault reference resolves here, and
        # it is stored encrypted, which config.params is not. LAB-VERIFIED
        # 2026-09-08 against a live Prisma AIRS tenant, replacing the earlier
        # params.api_key + $(conf.params.api_key) interpolation.
        auth:
          location: header
          name: x-pan-token
          value: "{vault://env/airs-token}"
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body:
          # Correlation identifiers, built by airs_correlation below. They nest:
          # transaction_id is one ROUND, a prompt and the response it produced,
          # and carries the same value in the INPUT and the OUTPUT scan so Strata
          # Cloud Manager shows the two verdicts as one exchange; session_id is
          # the CONVERSATION grouping several rounds, taken from the caller's
          # header and falling back to the round so an exchange is never split
          # across two sessions. tr_id is deliberately absent: on a live tenant
          # it is the older name of session_id, not of transaction_id. A field
          # the function leaves nil is omitted from the payload; an empty string
          # would be sent as JSON false.
          transaction_id: "$(airs_correlation.transaction_id)"
          session_id: "$(airs_correlation.session_id)"
          ai_profile: "$(airs_profile)"
          metadata: "$(airs_metadata)"
          contents: "$(airs_contents)"

      response:
        block: "$(airs_verdict.block)"
        block_message: "$(airs_verdict.block_message)"

      metrics:
        # As in airs-scan: block_reason a string, block_detail a table
        # (LAB-VERIFIED 2026-09-14, a string there is dropped with a warning).
        block_reason: "$(airs_verdict.block_message)"
        block_detail: "$(airs_verdict.detail)"

      # Byte-identical to the functions of airs-scan. scripts/run-lua-tests.sh
      # fails the build if any copy drifts.
      functions:
        airs_correlation: |
          return function(conf)
            -- Correlation identifiers for the Prisma AIRS scan log. They nest, and the
            -- two are not interchangeable: transaction_id is ONE ROUND, a prompt and the
            -- response it produced, while session_id is the CONVERSATION that groups
            -- several rounds.
            -- A round is Kong's own request id, so the INPUT and the OUTPUT scan of one
            -- exchange share it. A conversation can only come from the caller; when no
            -- session header is sent, session_id falls back to the round, so the two
            -- scans of one exchange still land in one session instead of two.
            -- tr_id is deliberately NOT sent. On a live tenant it is the older name of
            -- session_id, not of transaction_id: sending tr_id alone sets session_id to
            -- that value, and when both are sent session_id wins (LAB-VERIFIED
            -- 2026-09-14, six probes straight against /v1/scan/sync/request).
            -- Every PDK call below is wrapped in pcall on purpose. On a STREAMED
            -- response the OUTPUT phase runs with no request context, and an unguarded
            -- raise there does not fail the request: it silently skips the scan
            -- (LAB-VERIFIED 2026-09-14). Returning an empty table is the safe outcome --
            -- a nil field is omitted from the scan payload, while an empty string is
            -- rendered as JSON false, which is not a valid identifier.
            local ok, shared = pcall(function() return kong.ctx.shared end)
            if not ok or type(shared) ~= "table" then return {} end
            if type(shared.airs_correlation) == "table" then return shared.airs_correlation end
            local function header(name)
              if type(name) ~= "string" or name == "" then return nil end
              local got, value = pcall(function() return kong.request.get_header(name) end)
              if got and type(value) == "string" and #value > 0 and #value <= 256 then return value end
              return nil
            end
            local params = conf.params or {}
            local round = header(params.transaction_header)
            if round == nil then
              local got, request_id = pcall(function() return ngx.var.request_id end)
              if got and type(request_id) == "string" and #request_id > 0 then round = request_id end
            end
            if round == nil then return {} end
            local correlation = {
              transaction_id = round,
              session_id = header(params.session_header) or round,
            }
            shared.airs_correlation = correlation
            return correlation
          end

        airs_profile: |
          return function(conf)
            return { profile_name = conf.params.profile }
          end

        airs_metadata: |
          return function(conf)
            local params = (conf and conf.params) or {}
            -- Every lookup is pcall-guarded and may yield nothing: on a streamed OUTPUT
            -- segment there is no request context at all, and an unguarded raise there
            -- silently skips the scan rather than failing the request (LAB-VERIFIED
            -- 2026-09-14). A field that cannot be built is left nil, which the plugin
            -- omits from the payload; an empty string would be sent as JSON false.
            local function first(...)
              for _, get in ipairs({ ... }) do
                local ok, value = pcall(get)
                if ok and type(value) == "string" and #value > 0 and #value <= 256 then
                  return value
                end
              end
              return nil
            end
            return {
              app_name = params.app_name,
              ai_model = first(function() return ngx.ctx.ai_model.name end,
                               function() return kong.request.get_body().model end),
              user_ip = first(function() return kong.client.get_forwarded_ip() end,
                              function() return kong.client.get_ip() end),
              -- The authenticated consumer first: it is the identity Kong established.
              -- The header is the fallback for a gateway fronting an application that
              -- knows its end user, and it is caller-controlled -- fine for a scan-log
              -- label, never to be treated as an authenticated identity.
              app_user = first(function()
                                 local consumer = kong.client.get_consumer()
                                 return consumer and (consumer.username or consumer.id) or nil
                               end,
                               function() return kong.request.get_header(params.user_header) end),
            }
          end

        airs_contents: |
          return function(source, content, conf)
            -- The type guard comes first and has no fallback. Built-ins are injected by
            -- parameter name, so a Kong change to that mapping, or a typo in a name,
            -- would hand this function something other than the scanned text; a
            -- permissive fallback would then JSON-encode whatever arrived and ship it to
            -- Prisma AIRS. Raising refuses the request with HTTP 500 before the model is
            -- called (LAB-VERIFIED 2026-09-08).
            if type(content) ~= "string" then
              error("airs_contents: content is not a string; refusing to build the scan payload")
            end
            -- ONE element, always. Prisma AIRS judges the LAST element of contents[] and
            -- treats the earlier ones as context only: an injection placed in any but
            -- the last element comes back allow/benign (LAB-VERIFIED 2026-09-14). So
            -- everything that must be scanned has to be inside the element sent last.
            if source == "OUTPUT" then return { { response = content } } end
            if source ~= "INPUT" then
              error("airs_contents: unknown phase " .. tostring(source))
            end
            local flat = { { prompt = content } }
            -- Rebuild the scanned text from the request body, with each turn attributed.
            -- text_source joins message CONTENT only, with no indication of who said
            -- what, and that alone produces false positives on ordinary conversation:
            -- "And Italy? / The capital of France is Paris. / What is the capital of
            -- France?" was blocked as agent + injection, three times out of three, on a
            -- live tenant -- the assistant's own answer, unattributed, reads as an
            -- assertion planted in the prompt. The same turns prefixed "user:" and
            -- "assistant:" come back benign, in either order, while a real injection
            -- still blocks whether it is the newest turn or an earlier one
            -- (LAB-VERIFIED 2026-09-14).
            local ok, body = pcall(function() return kong.request.get_body() end)
            if not ok or type(body) ~= "table" or type(body.messages) ~= "table" then
              return flat
            end
            local params = (conf and conf.params) or {}
            local mode = params.tool_scan
            local want_tools = (mode == "calls" or mode == "catalogue")
            local loaded, cjson = pcall(require, "cjson.safe")
            local encode = (loaded and type(cjson) == "table") and cjson.encode or nil
            local parts, count = {}, 0
            local function push(text)
              if type(text) == "string" and text ~= "" then
                count = count + 1
                parts[count] = text
              end
            end
            -- The tool catalogue is the tool-poisoning surface. It is also the most
            -- likely to be flagged as source code, since a JSON parameter schema reads
            -- as code to a profile with that detector on, which is why it is its own
            -- opt-in rather than part of "calls".
            if mode == "catalogue" and encode and type(body.tools) == "table" then
              push(encode(body.tools))
            end
            for _, message in ipairs(body.messages) do
              if type(message) ~= "table" then return flat end
              local role, text = message.role, message.content
              -- Message content is a string on the common path, but an ARRAY of
              -- parts as soon as the client attaches a file -- what Open WebUI and
              -- most SDKs send. Skipping such a turn dropped it from the scanned
              -- text while the other turns kept count > 0, so the flat fallback
              -- never fired and an injection hidden in an array part was never
              -- judged. Assemble the text parts instead, and fall back to the flat
              -- text on any shape not understood rather than narrowing the scan.
              if type(text) == "table" then
                local chunks, seen = {}, 0
                for _, part in ipairs(text) do
                  if type(part) ~= "table" then return flat end
                  seen = seen + 1
                  local kind = part.type
                  if kind == "text" then
                    if type(part.text) ~= "string" then return flat end
                    chunks[#chunks + 1] = part.text
                  elseif kind ~= "image_url" and kind ~= "input_audio" and kind ~= "file" then
                    return flat
                  end
                end
                -- image_url, input_audio and file parts carry no text to scan, so they
                -- are skipped and a turn made only of those contributes nothing, exactly
                -- like an empty content string -- an image with no caption is ordinary
                -- multimodal use, not a shape to bail out on. Any OTHER part type,
                -- unknown or missing altogether, falls back to the flat text instead, so
                -- an unrecognised shape can never silently narrow the scan. Walking zero
                -- parts is that same unknown shape -- an empty array, or a map-shaped
                -- content table ipairs does not enumerate -- and is only expected on a
                -- tool call.
                if seen == 0 and type(message.tool_calls) ~= "table" then return flat end
                text = table.concat(chunks, "\n")
              end
              if type(text) == "string" and text ~= "" then
                -- Only user and assistant turns are labelled. A "system:" prefix is
                -- exactly the shape of a system-prompt spoof, and writing it ourselves
                -- gets the whole conversation blocked as agent + injection (LAB-VERIFIED
                -- 2026-09-14) -- so the system prompt, tool results and any unknown role
                -- go in unlabelled, which is what they were before this change.
                if role == "user" or role == "assistant" then
                  push(role .. ": " .. text)
                else
                  push(text)
                end
              end
              if want_tools and type(message.tool_calls) == "table" then
                for _, call in ipairs(message.tool_calls) do
                  local fn = (type(call) == "table" and type(call["function"]) == "table")
                    and call["function"] or nil
                  if fn then
                    local arguments = fn.arguments
                    if type(arguments) ~= "string" and encode then
                      arguments = encode(arguments)
                    end
                    if type(arguments) == "string" then
                      push((type(fn.name) == "string" and fn.name or "tool") .. " " .. arguments)
                    end
                  end
                end
              end
            end
            if count == 0 then return flat end
            local cap = tonumber(params.context_messages or "")
            if cap and cap >= 1 and count > cap then
              local trimmed = {}
              for i = count - cap + 1, count do trimmed[#trimmed + 1] = parts[i] end
              parts = trimmed
            end
            return { { prompt = table.concat(parts, "\n\n") } }
          end

        airs_verdict: |
          return function(resp)
            -- $(resp) is a table in BOTH phases on Kong AI Gateway 2.0.3, so this
            -- branch is inactive today. Kept: require and cjson.safe.decode work in a
            -- guardrail function, so it is real cover if a release ever passes a
            -- string — without it such a release would fail every request closed.
            if type(resp) == "string" then
              local ok, decoded = pcall(function()
                return require("cjson.safe").decode(resp)
              end)
              resp = ok and decoded or nil
            end
            -- Fail closed: without a verdict, no decision can be trusted. detail is
            -- always a table: metrics.block_detail drops a string (LAB-VERIFIED).
            if type(resp) ~= "table" or type(resp.action) ~= "string" then
              return { block = true, block_message = "Blocked by Prisma AIRS", detail = {
                reason = "verdict unavailable (fail-closed)", category = "unavailable", detections = {} } }
            end
            local msg = "Blocked by Prisma AIRS"
            if resp.scan_id then msg = msg .. " [scan_id=" .. tostring(resp.scan_id) .. "]" end
            -- AIRS reports its own degradation through category, with action=allow.
            if resp.category == "error" or resp.category == "timeout" then
              return { block = true, block_message = msg, detail = {
                reason = "scan " .. resp.category .. " (fail-closed)", category = resp.category, detections = {} } }
            end
            if resp.action == "allow" then
              return { block = false, block_message = "", detail = { reason = "", category = "", detections = {} } }
            end
            -- Category and detection names go to detail, never to the client.
            local hits = {}
            for _, key in ipairs({ "prompt_detected", "response_detected" }) do
              if type(resp[key]) == "table" then
                for name, fired in pairs(resp[key]) do
                  if fired == true then hits[#hits + 1] = tostring(name) end
                end
              end
            end
            table.sort(hits)
            local category = tostring(resp.category or "unknown")
            local reason = resp.action == "block" and category or ("unexpected action " .. resp.action)
            if #hits > 0 then reason = reason .. ": " .. table.concat(hits, ", ") end
            return { block = true, block_message = msg, detail = { reason = reason, category = category, detections = hits } }
          end

# =============================================================================
# Attaching a policy.
# Take the existing AI Model definition and add ONE reference to its policies
# array, then re-apply it. Indicative extract:
# =============================================================================
#
# ai_gateway_models:
#   - ref: my-gpt-4o
#     ai_gateway: !lookup { id: !env AI_GATEWAY_ID }
#     name: my-gpt-4o
#     type: model
#     formats:
#       - type: openai
#     config:
#       # Simple mode (default): leave response_streaming at allow. Non-streamed
#       # responses are scanned whole before delivery; streamed responses get
#       # prompt scanning plus best-effort per-segment response scanning that
#       # does not slow the stream and cannot stop the segment already
#       # delivered (LAB-VERIFIED 2026-09-14: roughly output rate x scan
#       # latency, plus one segment, leaks before the cut).
#       # Strict mode: uncomment the line below. A stream: true request is then
#       # refused with HTTP 400 {"error":{"message":"response streaming is not
#       # enabled for this LLM"}} before any guardrail call (DOCUMENTED
#       # https://developer.konghq.com/ai-gateway/streaming/, allow | deny |
#       # always; LAB-VERIFIED 2026-09-14), and models that must stream take
#       # airs-prompt-scan instead.
#       # response_streaming: deny
#     policies:
#       - !ref airs-scan            # prompt and response
#       # - !ref airs-prompt-scan   # prompt only, for streaming models
#     targets:
#       - name: gpt-4o
#         provider: generic-openai
#         config:
#           type: openai
#     capabilities:
#       - generate
#
# Do not reference both on the same model: Kong runs one instance of a given
# plugin per request, and airs-scan already covers both directions.
#
# To protect every model on the gateway instead, declare one policy with
# global: true rather than referencing it per model.
