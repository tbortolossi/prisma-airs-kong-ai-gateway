# =============================================================================
# Prisma AIRS AI Runtime (API Intercept) on Kong AI Gateway 2.x
#
# Shape : AI Gateway 2.x control plane in Konnect, self-managed data planes
# Tool  : kongctl apply -f config/kongctl/airs-guardrail.yaml
# Needs : data planes on Kong Gateway 3.14+ with an AI licence
#
# Declares two AI Policies of type ai-custom-guardrail. No custom plugin,
# no data plane image rebuild. The two policies differ by COVERAGE, not by
# direction, and their config blocks are identical except for guarding_mode:
#
#   airs-scan         guarding_mode: BOTH   prompt in INPUT, model output in OUTPUT
#   airs-prompt-scan  guarding_mode: INPUT  prompt only, for streaming models
#
# Attach exactly ONE of them per AI Model. Kong runs a single instance of a
# given plugin per request, so stacking both on the same model does not give
# prompt-plus-response coverage; airs-scan already does.
#
# VERIFICATION STATUS (full table in README.md, "Verification status")
#   DOCUMENTED  : every config key used below, and its allowed values, come from
#                 the plugin schema at
#                 https://developer.konghq.com/plugins/ai-custom-guardrail/reference/
#                 guarding_mode is an enum of BOTH | INPUT | OUTPUT.
#                 params, request.headers and request.body are referenceable,
#                 so {vault://...} resolves inside them.
#                 Dotted access to a function result, "$(fn.field)", is shown
#                 in Kong's Azure Content Safety example
#                 ($(check_response.block), $(check_response.block_message)).
#                 $(source) is documented by the plugin overview as "INPUT" while
#                 inspecting the request and "OUTPUT" while inspecting the
#                 response; $(resp) as a Lua table in INPUT and a string in
#                 OUTPUT.
#                 The Prisma AIRS request and response shapes come from the
#                 generated OpenAPI client in PaloAltoNetworks/aisecurity-python-sdk.
#   LAB-VERIFIED : functions are referenced BARE, "$(fn)", and the built-ins are
#                 injected BY PARAMETER NAME, not by position: a function
#                 declaring (source, content) receives them, one declaring
#                 (conf) receives the config, one declaring (resp, source)
#                 receives the guardrail response and the phase. An unknown
#                 parameter name is rejected outright — "argument 'a' is not
#                 allowed in guardrail functions". The explicit-argument call
#                 form "$(fn(source, content))" this repository shipped until
#                 2026-09-08 is NOT valid: the data plane answers 500,
#                 "failed to render by function: invalid expression syntax",
#                 and no request reaches the model. Observed on Kong AI Gateway
#                 2.0.3 / Kong Gateway 3.14.0.3-enterprise.
#   LAB-VERIFIED : $(resp) is a Lua TABLE in both phases, OUTPUT included. The
#                 plugin overview's "string when inspecting the response" does
#                 not hold for the guardrail service response. The cjson.safe
#                 branch in the OUTPUT verdict is therefore dead code.
#   LAB-VERIFIED : a block returns HTTP 400 with the body
#                 {"error":{"message":"<block_message>"}}.
#   LAB-VERIFIED : with text_source concatenate_all_content, $(content) is the
#                 message contents joined by "\n\n", system prompt included,
#                 and the model output alone in the OUTPUT phase.
#   LAB-VERIFIED : streamed responses ARE scanned (2026-09-14, correcting the
#                 2026-09-08 note that said the OUTPUT phase was never
#                 invoked). With stream: true the OUTPUT phase runs once per
#                 segment of about response_buffer_size bytes, each segment as
#                 its own contents[].response call, and whatever is still below
#                 the threshold when the stream ends is never scanned. That is
#                 why the 2026-09-08 run, with response_buffer_size 65536, saw
#                 no OUTPUT call at all. A block verdict on a segment cuts the
#                 stream, but that segment has already been delivered and HTTP
#                 200 already sent. Non-streamed responses are scanned in one
#                 call carrying the whole body, whatever the buffer size. The
#                 posture for airs-scan is therefore to refuse streaming at the
#                 model (response_streaming: deny, attachment extract below).
#   LAB-VERIFIED : a function that raises refuses the request with HTTP 500
#                 before the model is called, independent of stop_on_error.
#                 The Lua error text reaches the client verbatim, so error()
#                 messages must never carry anything sensitive.
#   LAB-VERIFIED : metrics.* templates are evaluated, and block_detail must
#                 evaluate to a TABLE. With a string the data plane logged
#                 "metric input_block_detail has unexpected type string,
#                 expected table" at every request and dropped the metric
#                 (2026-09-14); airs_verdict.detail is a table for that reason.
#                 Export to Konnect AI analytics is not verified.
#   LAB-VERIFIED : response_buffer_size is left at its schema default (100).
#                 The 65536 this repository shipped until 2026-09-14 turned a
#                 streamed response into silence (see the streaming entry).
#   NOT PRESENT : retry and cache options. The plugin schema has neither.
#
# Replace params.profile with your Prisma AIRS security profile name, and
# params.app_name with a label identifying this gateway in your scan logs.
# If your AIRS tenant is not on the global endpoint, change request.url.
# =============================================================================

ai_gateway_policies:

  # ---------------------------------------------------------------------------
  # airs-scan: prompt and response
  # Scans the prompt before it reaches the model and the model output before
  # it reaches the client. On a non-streamed response the output is one scan
  # of the whole body. On a streamed response it is one scan per segment of
  # about response_buffer_size bytes, the flagged segment already delivered
  # by the time it is blocked (LAB-VERIFIED 2026-09-14). Pair this policy
  # with response_streaming: deny on the model (attachment extract below);
  # models that must stream get airs-prompt-scan instead.
  # ---------------------------------------------------------------------------
  - ref: airs-scan
    ai_gateway: !lookup { id: !env AI_GATEWAY_ID }
    name: airs-scan
    display_name: "Prisma AIRS - prompt and response scan"
    type: ai-custom-guardrail
    enabled: true
    config:
      # The enum is BOTH | INPUT | OUTPUT. Prisma AIRS keys prompts and
      # responses differently (contents[].prompt vs contents[].response);
      # airs_contents below picks the key from $(source).
      guarding_mode: BOTH
      text_source: concatenate_all_content

      # Schema defaults are timeout 10000 and stop_on_error true. Both are
      # restated because they are load-bearing: stop_on_error is what actually
      # blocks traffic when the AIRS call itself fails, and 10 s of added
      # latency on an unreachable endpoint is too long for an inline guardrail.
      timeout: 5000
      ssl_verify: true
      stop_on_error: true

      # Present on Kong AI Gateway 2.0.1+ data planes (changelog,
      # https://developer.konghq.com/ai-gateway/changelog/), LAB-VERIFIED
      # 2026-09-14 on 2.0.3 / Kong Gateway 3.14.0.3, but ABSENT from the
      # published schema page: uncommenting one makes
      # scripts/check-plugin-schema.py --schema fail until Kong publishes it.
      #   rejection_mode         none (default) is today's contract, HTTP 400
      #                          with the message. verbose: HTTP 403, structured
      #                          body, code GUARDRAIL_BLOCKED, the message as
      #                          "reason", no detail leaked. stealth: HTTP 403
      #                          "request forbidden", message and scan_id lost.
      #   continue_on_detection  true is monitor mode for pilots: a block
      #                          verdict passes with HTTP 200, the guardrail is
      #                          still called. Does not cover a failed call.
      #   log_blocked_content    keep false, prompts are PII.
      # rejection_mode: verbose
      # continue_on_detection: true
      # log_blocked_content: false

      # response_buffer_size is deliberately NOT set; the schema default (100)
      # applies. LAB-VERIFIED 2026-09-14: it only matters for streams. A
      # non-streamed response is always scanned in one call carrying the whole
      # body. A streamed response is scanned in segments of about that many
      # bytes, and whatever remains below the threshold when the stream ends
      # is never scanned: at 65536, the value shipped until 2026-09-14, a
      # typical completion produced no OUTPUT call at all, which is what the
      # 2026-09-08 run measured. A block on a segment cuts the stream after
      # that segment has already reached the client.

      params:
        profile: "kong-airs-prod"
        app_name: "kong-ai-gateway"

      request:
        url: https://service.api.aisecurity.paloaltonetworks.com/v1/scan/sync/request
        # request.auth is the schema's dedicated slot for the credential:
        # value is referenceable, so the vault reference resolves here, and
        # it is stored encrypted, which config.params is not. LAB-VERIFIED
        # 2026-09-08 against a live Prisma AIRS tenant, replacing the earlier
        # params.api_key + $(conf.params.api_key) interpolation.
        auth:
          location: header
          name: x-pan-token
          value: "{vault://env/airs-token}"
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        # request.body is a flat map of strings. Nested JSON is produced by
        # functions that return a Lua table, as in Kong's Azure Content Safety
        # example. A nested YAML map here fails schema validation.
        body:
          ai_profile: "$(airs_profile)"
          metadata: "$(airs_metadata)"
          contents: "$(airs_contents)"

      response:
        block: "$(airs_verdict.block)"
        block_message: "$(airs_verdict.block_message)"

      # metrics.* templates are evaluated (LAB-VERIFIED 2026-09-14). This is
      # the channel that keeps the category and the detection names out of
      # the client response and in the gateway's own telemetry.
      metrics:
        # block_reason is a string: the generic message with scan_id, for
        # correlation with the Prisma AIRS scan log. block_detail must be a
        # TABLE: as a string the data plane logs "metric input_block_detail
        # has unexpected type string, expected table" at every request and
        # drops it (LAB-VERIFIED 2026-09-14). airs_verdict.detail is
        # { reason, category, detections }.
        block_reason: "$(airs_verdict.block_message)"
        block_detail: "$(airs_verdict.detail)"

      functions:
        airs_profile: |
          return function(conf)
            return { profile_name = conf.params.profile }
          end

        airs_metadata: |
          return function(conf)
            return { app_name = conf.params.app_name }
          end

        # Builds contents[] from the phase. The reference is bare: the plugin
        # injects source and content by parameter name. LAB-VERIFIED
        # 2026-09-08. A function that raises fails the request closed with
        # HTTP 500, verified the same day.
        # The type guard is mandatory, and its reason changed with the lab
        # run. Built-ins are injected by parameter name, so a Kong change to
        # that mapping — or a typo in a parameter name — would hand this
        # function something other than the scanned text. A permissive
        # fallback such as `content or ""` would then JSON-encode whatever
        # arrived into contents[].prompt and ship it to Prisma AIRS and its
        # scan logs. The API key is no longer exposed that way since the
        # credential moved to request.auth, but the profile name, the app
        # name and any future param would be. Raising is safe: a function
        # that errors returns HTTP 500 and the request never reaches the
        # model. LAB-VERIFIED 2026-09-08.
        airs_contents: |
          return function(source, content)
            if type(content) ~= "string" then
              error("airs_contents: content is not a string; refusing to build the scan payload")
            end
            if source == "INPUT" then return { { prompt = content } } end
            if source == "OUTPUT" then return { { response = content } } end
            error("airs_contents: unknown phase " .. tostring(source))
          end

        # Maps the AIRS ScanResponse to Kong's block decision. The client only
        # ever sees "Blocked by Prisma AIRS" plus the scan_id; the category and
        # the detection names go to `detail`, a table { reason, category,
        # detections } wired to metrics.block_detail above (a table because
        # the data plane drops a string there, LAB-VERIFIED 2026-09-14).
        # Naming the detection to the caller is an evasion oracle, and Palo
        # Alto's own reference integration returns a generic body.
        airs_verdict: |
          return function(resp)
            -- $(resp) is a table in BOTH phases on Kong AI Gateway 2.0.3, so this
            -- branch is inactive today. Kept: require and cjson.safe.decode work in a
            -- guardrail function, so it is real cover if a release ever passes a
            -- string — without it such a release would fail every request closed.
            if type(resp) == "string" then
              local ok, decoded = pcall(function()
                return require("cjson.safe").decode(resp)
              end)
              resp = ok and decoded or nil
            end
            -- Fail closed: without a verdict, no decision can be trusted. detail is
            -- always a table: metrics.block_detail drops a string (LAB-VERIFIED).
            if type(resp) ~= "table" or type(resp.action) ~= "string" then
              return { block = true, block_message = "Blocked by Prisma AIRS", detail = {
                reason = "verdict unavailable (fail-closed)", category = "unavailable", detections = {} } }
            end
            local msg = "Blocked by Prisma AIRS"
            if resp.scan_id then msg = msg .. " [scan_id=" .. tostring(resp.scan_id) .. "]" end
            -- AIRS reports its own degradation through category, with action=allow.
            if resp.category == "error" or resp.category == "timeout" then
              return { block = true, block_message = msg, detail = {
                reason = "scan " .. resp.category .. " (fail-closed)", category = resp.category, detections = {} } }
            end
            if resp.action == "allow" then
              return { block = false, block_message = "", detail = { reason = "", category = "", detections = {} } }
            end
            -- Category and detection names go to detail, never to the client.
            local hits = {}
            for _, key in ipairs({ "prompt_detected", "response_detected" }) do
              if type(resp[key]) == "table" then
                for name, fired in pairs(resp[key]) do
                  if fired == true then hits[#hits + 1] = tostring(name) end
                end
              end
            end
            table.sort(hits)
            local category = tostring(resp.category or "unknown")
            local reason = resp.action == "block" and category or ("unexpected action " .. resp.action)
            if #hits > 0 then reason = reason .. ": " .. table.concat(hits, ", ") end
            return { block = true, block_message = msg, detail = { reason = reason, category = category, detections = hits } }
          end

  # ---------------------------------------------------------------------------
  # airs-prompt-scan: prompt only
  # Same config as airs-scan with guarding_mode INPUT, for models that must
  # stream. On a stream airs-scan would scan the output per segment, with the
  # flagged segment already delivered and one AIRS round trip per segment
  # (LAB-VERIFIED 2026-09-14); this variant makes the trade-off explicit
  # instead: the prompt is scanned, the model output is not.
  # ---------------------------------------------------------------------------
  - ref: airs-prompt-scan
    ai_gateway: !lookup { id: !env AI_GATEWAY_ID }
    name: airs-prompt-scan
    display_name: "Prisma AIRS - prompt scan"
    type: ai-custom-guardrail
    enabled: true
    config:
      guarding_mode: INPUT
      text_source: concatenate_all_content

      timeout: 5000
      ssl_verify: true
      stop_on_error: true

      # Same 2.0.1+ fields as in airs-scan, absent from the published schema;
      # read the note there before uncommenting any of them.
      # rejection_mode: verbose
      # continue_on_detection: true
      # log_blocked_content: false

      # response_buffer_size is not set here either (schema default, and
      # unused with guarding_mode INPUT: response guard only).

      params:
        profile: "kong-airs-prod"
        app_name: "kong-ai-gateway"

      request:
        url: https://service.api.aisecurity.paloaltonetworks.com/v1/scan/sync/request
        # request.auth is the schema's dedicated slot for the credential:
        # value is referenceable, so the vault reference resolves here, and
        # it is stored encrypted, which config.params is not. LAB-VERIFIED
        # 2026-09-08 against a live Prisma AIRS tenant, replacing the earlier
        # params.api_key + $(conf.params.api_key) interpolation.
        auth:
          location: header
          name: x-pan-token
          value: "{vault://env/airs-token}"
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body:
          ai_profile: "$(airs_profile)"
          metadata: "$(airs_metadata)"
          contents: "$(airs_contents)"

      response:
        block: "$(airs_verdict.block)"
        block_message: "$(airs_verdict.block_message)"

      metrics:
        # As in airs-scan: block_reason a string, block_detail a table
        # (LAB-VERIFIED 2026-09-14, a string there is dropped with a warning).
        block_reason: "$(airs_verdict.block_message)"
        block_detail: "$(airs_verdict.detail)"

      # Byte-identical to the functions of airs-scan. scripts/run-lua-tests.sh
      # fails the build if any copy drifts.
      functions:
        airs_profile: |
          return function(conf)
            return { profile_name = conf.params.profile }
          end

        airs_metadata: |
          return function(conf)
            return { app_name = conf.params.app_name }
          end

        airs_contents: |
          return function(source, content)
            if type(content) ~= "string" then
              error("airs_contents: content is not a string; refusing to build the scan payload")
            end
            if source == "INPUT" then return { { prompt = content } } end
            if source == "OUTPUT" then return { { response = content } } end
            error("airs_contents: unknown phase " .. tostring(source))
          end

        airs_verdict: |
          return function(resp)
            -- $(resp) is a table in BOTH phases on Kong AI Gateway 2.0.3, so this
            -- branch is inactive today. Kept: require and cjson.safe.decode work in a
            -- guardrail function, so it is real cover if a release ever passes a
            -- string — without it such a release would fail every request closed.
            if type(resp) == "string" then
              local ok, decoded = pcall(function()
                return require("cjson.safe").decode(resp)
              end)
              resp = ok and decoded or nil
            end
            -- Fail closed: without a verdict, no decision can be trusted. detail is
            -- always a table: metrics.block_detail drops a string (LAB-VERIFIED).
            if type(resp) ~= "table" or type(resp.action) ~= "string" then
              return { block = true, block_message = "Blocked by Prisma AIRS", detail = {
                reason = "verdict unavailable (fail-closed)", category = "unavailable", detections = {} } }
            end
            local msg = "Blocked by Prisma AIRS"
            if resp.scan_id then msg = msg .. " [scan_id=" .. tostring(resp.scan_id) .. "]" end
            -- AIRS reports its own degradation through category, with action=allow.
            if resp.category == "error" or resp.category == "timeout" then
              return { block = true, block_message = msg, detail = {
                reason = "scan " .. resp.category .. " (fail-closed)", category = resp.category, detections = {} } }
            end
            if resp.action == "allow" then
              return { block = false, block_message = "", detail = { reason = "", category = "", detections = {} } }
            end
            -- Category and detection names go to detail, never to the client.
            local hits = {}
            for _, key in ipairs({ "prompt_detected", "response_detected" }) do
              if type(resp[key]) == "table" then
                for name, fired in pairs(resp[key]) do
                  if fired == true then hits[#hits + 1] = tostring(name) end
                end
              end
            end
            table.sort(hits)
            local category = tostring(resp.category or "unknown")
            local reason = resp.action == "block" and category or ("unexpected action " .. resp.action)
            if #hits > 0 then reason = reason .. ": " .. table.concat(hits, ", ") end
            return { block = true, block_message = msg, detail = { reason = reason, category = category, detections = hits } }
          end

# =============================================================================
# Attaching a policy.
# Take the existing AI Model definition and add ONE reference to its policies
# array, then re-apply it. Indicative extract:
# =============================================================================
#
# ai_gateway_models:
#   - ref: my-gpt-4o
#     ai_gateway: !lookup { id: !env AI_GATEWAY_ID }
#     name: my-gpt-4o
#     type: model
#     formats:
#       - type: openai
#     config:
#       # Refuse stream: true at the model, so airs-scan always sees the whole
#       # response in one scan and nothing reaches the client before the
#       # verdict. DOCUMENTED https://developer.konghq.com/ai-gateway/streaming/
#       # (allow | deny | always). LAB-VERIFIED 2026-09-14: a stream: true
#       # request gets HTTP 400 {"error":{"message":"response streaming is not
#       # enabled for this LLM"}} before any guardrail call. Drop this line and
#       # reference airs-prompt-scan instead for a model that must stream.
#       response_streaming: deny
#     policies:
#       - !ref airs-scan            # prompt and response
#       # - !ref airs-prompt-scan   # prompt only, for streaming models
#     targets:
#       - name: gpt-4o
#         provider: generic-openai
#         config:
#           type: openai
#     capabilities:
#       - generate
#
# Do not reference both on the same model: Kong runs one instance of a given
# plugin per request, and airs-scan already covers both directions.
#
# To protect every model on the gateway instead, declare one policy with
# global: true rather than referencing it per model.
