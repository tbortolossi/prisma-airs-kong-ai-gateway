# =============================================================================
# Optional: one diagnostics log on the node, to send when something misbehaves
#
# Shape : AI Gateway 2.x control plane in Konnect, self-managed data planes
# Tool  : kongctl apply -f config/kongctl/airs-diagnostics-log.yaml
# Needs : nothing beyond the data plane. file-log is a core Kong plugin.
#
# WHY THIS EXISTS
# The guardrail's own record — which request was blocked, by which category,
# on which detections, in which direction, and how long the scan took — only
# leaves the data plane through Kong's log serializer. Without a logging
# policy it is nowhere: the Konnect Requests analytics view carries the
# ai-proxy entry only, and the data plane's error log carries guardrail call
# FAILURES but not verdicts. This policy writes the serializer record to the
# node's standard output, so that reporting a problem is one command:
#
#     docker logs <data-plane-container>          # or
#     kubectl logs <data-plane-pod>
#
# THE SWITCH
# `enabled` below is the on/off control. Applying this file at all is the
# first opt-in; after that, flip `enabled` and re-apply to mute or restore it
# without detaching the policy. It ships enabled, because a log that is off
# cannot explain an incident that has already happened.
#
# Attach it to the same AI Model as airs-scan or airs-prompt-scan:
#
#     policies:
#       - !ref airs-scan
#       - !ref airs-diagnostics-log
#
# VERIFICATION STATUS
#   DOCUMENTED   : file-log config is exactly path, reopen and
#                  custom_fields_by_lua
#                  https://developer.konghq.com/plugins/file-log/reference/
#                  Confirmed against the live 2.0.3 data plane's own schema:
#                  those three fields and no others.
#   DOCUMENTED   : custom_fields_by_lua maps a log field to a Lua chunk, and a
#                  chunk returning nil removes the field from the record
#                  https://developer.konghq.com/plugins/file-log/
#   DOCUMENTED   : the AI Gateway 2.x declarative `type` accepts a non-AI
#                  plugin name (kongctl declarative docs); file-log was
#                  accepted as an ai_gateway_policies entry on 2026-09-14.
#   DOCUMENTED   : the guardrail fields this record carries —
#                  ai.proxy.custom-guardrail.{input,output}_block_reason /
#                  _block_detail / _block_source / _processing_latency and
#                  ai.proxy.guardrail_triggered.block_direction
#                  https://developer.konghq.com/ai-gateway/ai-audit-log-reference/
#   LAB-VERIFIED : 2026-09-14, Kong AI Gateway 2.0.3 / Kong Gateway 3.14.0.3,
#                  against the live Prisma AIRS tenant. Applied next to
#                  airs-scan on the model with
#                  `kongctl apply -f airs-guardrail.yaml
#                   -f airs-diagnostics-log.yaml -f <model>.yaml` — repeated
#                  -f flags share one ref namespace, so !ref resolves across
#                  the files. path: /dev/stdout puts one JSON record per
#                  request into `docker logs`, on the allowed request and on
#                  the blocked one. The custom_fields_by_lua removals work: a
#                  request carrying Authorization, x-api-key and Cookie
#                  produced a record with none of the three and no trace of
#                  their values. `enabled: false` re-applied: no record at
#                  all, traffic unaffected (HTTP 200). This run covered five
#                  carriers: authorization, x-api-key, apikey, cookie,
#                  set-cookie. Proxy-Authorization and the query string were
#                  not part of it.
#   DOCUMENTED   : the log serializer's sample record carries the query
#                  string as its own field, `request.querystring`, a table of
#                  query parameter name to value; and dotted keys in
#                  custom_fields_by_lua "create nested fields", the same
#                  mechanism already relied on above to remove one key
#                  (`authorization`) from the existing `request.headers`
#                  table without touching its other entries
#                  https://developer.konghq.com/plugins/file-log/
#                  https://developer.konghq.com/plugins/file-log/reference/
#   SYNTHESIZED  : `request.headers.proxy-authorization` is the same
#                  mechanism as the five carriers above, for a header this
#                  policy did not previously scrub; not independently
#                  re-run.
#   LAB-VERIFIED : 2026-09-15, by the reviewer, against the live data plane.
#                  `POST /v1/chat/completions?apikey=PROBE&other=kept`
#                  produced a serializer record carrying the apikey value in
#                  FIVE places: request.querystring.apikey, request.uri,
#                  request.url, upstream_uri and
#                  ai.proxy.tried_targets[0].upstream_uri. Scrubbing only
#                  request.querystring.apikey, as this file did until now,
#                  left the other four carrying it in full. Kong's own proxy
#                  access log, on the same node stdout, also prints the raw
#                  request line with the query string, which no
#                  custom_fields_by_lua entry can reach — this policy cannot
#                  scrub that line at all.
#   DOCUMENTED   : `kong.request.get_path()`, `.get_scheme()`, `.get_host()`
#                  and `.get_port()` are PDK functions, and
#                  custom_fields_by_lua chunks may call the PDK — the
#                  published examples include
#                  `return kong.request.get_header('h1')`
#                  https://developer.konghq.com/gateway/pdk/reference/kong.request/
#                  https://developer.konghq.com/plugins/http-log/
#   SYNTHESIZED  : the five chunks below are this repository's response to
#                  the 2026-09-15 finding: wipe request.querystring outright,
#                  rebuild request.uri and request.url from the PDK's own
#                  path/scheme/host/port instead of echoing the raw value,
#                  and strip the query string from upstream_uri with a
#                  pattern match on the nginx variable. They cover this
#                  record's URI fields. They do NOT cover the node's proxy
#                  access log — see the LAB-VERIFIED entry above — which is
#                  not a custom_fields_by_lua field. Not independently run
#                  against a live data plane by this repository.
#   DOCUMENTED   : key-auth's `key_in_query` (default true) controls whether
#                  the plugin accepts the credential as a query parameter at
#                  all; set it false and the credential is never in the query
#                  string, on this record or in the access log
#                  https://developer.konghq.com/plugins/key-auth/reference/
#
# WHAT THE RECORD CONTAINS, AND WHAT IT DOES NOT
# Measured on an allowed and on a blocked request (2026-09-14): the record
# carries the guardrail verdict fields, ai-proxy token usage and model, Kong's
# latency breakdown, the route and service, the response status, and
# `request.id` — the same value Kong returns to the client as the
# X-Kong-Request-Id header, which is what lets a user's complaint be matched to
# a record. It carries NO prompt and NO model output: the serializer logs no
# bodies, and guardrail_triggered.blocked_content stays empty as long as the
# guardrail's own log_blocked_content is left false, as shipped.
#
# It does carry request and response HEADERS and the request QUERY STRING —
# and the query string does not live in one field. A credential passed as
# `?apikey=...` was measured, 2026-09-15 against the live data plane, in FIVE
# fields of the record: request.querystring.apikey, request.uri, request.url,
# upstream_uri and ai.proxy.tried_targets[0].upstream_uri. The
# custom_fields_by_lua entries below wipe request.querystring outright and
# strip the query string from the other four URI fields, which covers this
# record. They do NOT cover Kong's own proxy access log: it shares the node's
# stdout and prints the raw request line, query string included, and no
# custom_fields_by_lua entry can reach it. The only reliable posture is not to
# accept credentials in the query string at all — key-auth's
# `key_in_query: false` (default true) closes that off at the source
# (https://developer.konghq.com/plugins/key-auth/reference/). Add any header
# your clients use to authenticate, and review the first captured record
# before handing the procedure to an operator. Note that custom_fields_by_lua
# applies to the shared serializer table, so these removals also affect any
# logging plugin that runs after this one.
#
# On an ALLOWED request the guardrail fields are present but empty — there is
# no scan_id for a request that was not blocked. Correlating an allowed
# request with its Prisma AIRS scan entry is not possible in a
# configuration-only deployment; see the deployment guide, "Scan correlation".
# The two latency fields are the exception: input_processing_latency and
# output_processing_latency carry the real scan cost in milliseconds on every
# request, allowed included (632 ms and 454 ms against the global Prisma AIRS
# endpoint, LAB-VERIFIED 2026-09-14), which is what makes this record the
# place to look when the complaint is slowness rather than a block.
#
# VOLUME. One JSON line per request, on the node's stdout, alongside Kong's own
# log lines. Sized for diagnostics and for a pilot, not as a retention channel:
# for permanent collection, use http-log against the customer's own collector
# instead, with the same custom_fields_by_lua block.
# =============================================================================

ai_gateway_policies:
  - ref: airs-diagnostics-log
    ai_gateway: !lookup { id: !env AI_GATEWAY_ID }
    name: airs-diagnostics-log
    display_name: "Prisma AIRS - diagnostics log to the node's output"
    type: file-log
    # The on/off switch. false leaves the policy declared and attached but
    # inert; no record is written. Re-apply after changing it.
    enabled: true
    config:
      # The node's standard output, so the record lands in `docker logs` /
      # `kubectl logs` with no volume to mount and no file to rotate. To write
      # a real file instead, give a path inside a writable volume, for example
      # /tmp/airs-diagnostics.log, and collect it from there.
      path: /dev/stdout
      reopen: false
      # Remove the usual client-credential carriers from the record. These are
      # the headers a caller sends to the gateway; add yours if it differs.
      # LAB-VERIFIED 2026-09-14: authorization, x-api-key, apikey, cookie,
      # set-cookie. SYNTHESIZED, same mechanism, not independently re-run:
      # proxy-authorization.
      #
      # The query string is not one field. LAB-VERIFIED 2026-09-15 (live data
      # plane): a credential passed as ?apikey=... appears in
      # request.querystring.apikey, request.uri, request.url, upstream_uri
      # AND ai.proxy.tried_targets[0].upstream_uri. The five chunks below
      # (SYNTHESIZED, not independently re-run) wipe the querystring map
      # outright and strip the query string from the other four URI fields,
      # using documented PDK calls
      # (https://developer.konghq.com/gateway/pdk/reference/kong.request/;
      # the custom_fields_by_lua-calls-the-PDK pattern is also shown at
      # https://developer.konghq.com/plugins/http-log/). This still does not
      # reach Kong's own proxy access log on the same stdout, which prints
      # the raw request line unfiltered — no custom_fields_by_lua entry can
      # touch it. The reliable fix is to stop accepting the credential in the
      # query string at all: key-auth's key_in_query: false (default true;
      # https://developer.konghq.com/plugins/key-auth/reference/).
      custom_fields_by_lua:
        request.headers.authorization: "return nil"
        request.headers.x-api-key: "return nil"
        request.headers.apikey: "return nil"
        request.headers.cookie: "return nil"
        request.headers.proxy-authorization: "return nil"
        response.headers.set-cookie: "return nil"
        request.querystring: "return nil"
        request.uri: "return kong.request.get_path()"
        request.url: "return kong.request.get_scheme() .. '://' .. kong.request.get_host() .. ':' .. kong.request.get_port() .. kong.request.get_path()"
        upstream_uri: "local u = ngx.var.upstream_uri or '' return (u:gsub('%?.*$', ''))"
        ai.proxy.tried_targets: "return nil"
