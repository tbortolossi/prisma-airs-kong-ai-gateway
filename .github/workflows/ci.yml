name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The upstream plugin schema changes without this repo changing.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Verify configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Check YAML parses, with kongctl tags
        run: |
          python3 - <<'PY'
          import sys, yaml

          class Loader(yaml.SafeLoader):
              pass

          for tag in ("!lookup", "!env", "!ref"):
              Loader.add_constructor(tag, lambda loader, node: None)

          files = (
              "config/kongctl/airs-guardrail.yaml",
              "config/deck/airs-guardrail.yaml",
          )
          docs = {}
          for path in files:
              with open(path) as handle:
                  docs[path] = yaml.load(handle, Loader=Loader)
              print(f"{path} parses")

          # The two files must carry an identical config block. This is the
          # rule in CLAUDE.md: guardrail changes land in both, together.
          kongctl = docs[files[0]]["ai_gateway_policies"]
          deck = [
              plugin
              for plugin in docs[files[1]]["services"][0]["plugins"]
              if plugin["name"] == "ai-custom-guardrail"
          ]

          if len(kongctl) != len(deck):
              sys.exit(f"policy count differs: {len(kongctl)} vs {len(deck)}")

          failed = False
          for policy, plugin in zip(kongctl, deck):
              if policy["config"] != plugin["config"]:
                  failed = True
                  print(f"config differs for {policy['name']}")
                  keys = set(policy["config"]) | set(plugin["config"])
                  for key in sorted(keys):
                      if policy["config"].get(key) != plugin["config"].get(key):
                          print(f"  differs at: {key}")
              else:
                  print(f"{policy['name']}: kongctl and deck configs identical")

          sys.exit(1 if failed else 0)
          PY

      - name: Check guarding_mode against the published enum
        run: |
          # Guards the exact mistake this repo shipped before v0.1.0.
          if grep -nE '^\s*guarding_mode:\s*(REQUEST|RESPONSE)\b' -r config/; then
            echo "::error::guarding_mode must be BOTH, INPUT or OUTPUT"
            exit 1
          fi
          grep -hE '^\s*guarding_mode:' -r config/ | sort -u

      - name: Run offline verdict tests
        run: ./scripts/run-lua-tests.sh

      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
