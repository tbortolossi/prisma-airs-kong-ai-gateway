name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The upstream plugin schema changes without this repo changing.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: Verify configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Install PyYAML
        run: python3 -m pip install --user -r requirements-dev.txt

      - name: Check YAML parses and kongctl/deck config parity
        run: python3 scripts/check-plugin-schema.py --parity

      - name: Check guarding_mode against the published enum
        run: |
          # Guards the exact mistake this repo shipped before v0.1.0.
          if grep -nE '^\s*guarding_mode:\s*(REQUEST|RESPONSE)\b' -r config/; then
            echo "::error::guarding_mode must be BOTH, INPUT or OUTPUT"
            exit 1
          fi
          grep -hE '^\s*guarding_mode:' -r config/ | sort -u

      - name: Validate config against the live plugin schema
        # Runs on push, pull_request and the weekly cron alike, since all three
        # trigger this job. This is what the cron comment above promises: catch
        # the schema drifting out from under a repo that has not changed.
        run: |
          set +e
          python3 scripts/check-plugin-schema.py --schema
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            # Exit 3 is "could not fetch the schema", not "schema violation".
            # On push and pull_request the parity and Lua checks still gate the
            # change, so a docs outage is a warning there. On the weekly cron
            # the fetch is the whole point, so a miss must fail visibly.
            echo "::warning::published plugin schema could not be fetched; schema validation did not run"
            if [ "${{ github.event_name }}" = "schedule" ]; then exit 1; fi
            exit 0
          fi
          exit "$rc"

      - name: Run offline verdict tests
        run: ./scripts/run-lua-tests.sh

      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
